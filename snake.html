<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гра «Змійка»</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    #score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #game-container {
      position: relative;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    canvas {
      display: block;
      background: #ffffff;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.88);
      text-align: center;
      gap: 12px;
    }

    #overlay.hidden {
      display: none;
    }

    button {
      background: #22c55e;
      border: none;
      color: #052e16;
      font-weight: bold;
      font-size: 16px;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #controls {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>🐍 Змійка</h1>
  <div id="score-bar">
    <div>Рахунок: <span id="score">0</span></div>
    <div>Рекорд: <span id="best">0</span></div>
  </div>
  <div id="game-container">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Гра «Змійка»</h2>
      <p id="overlay-text">Натисніть «Старт» або пробіл</p>
      <button id="start-btn">Старт</button>
    </div>
  </div>
  <div id="controls">
    Стрілки / WASD для руху &bull; Пробіл — пауза &bull; Торкніться поля, щоб керувати на телефоні
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const TILE = canvas.width / GRID;

    let snake, dir, dirQueue, food, score, best = +(localStorage.getItem('snake-best') || 0);
    let running = false, paused = false, lastTime = 0, stepMs = 120;
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = { x: 1, y: 0 };
      dirQueue = [];
      score = 0;
      stepMs = 120;
      scoreEl.textContent = '0';
      placeFood();
    }

    function placeFood() {
      while (true) {
        food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
        if (!snake.some(s => s.x === food.x && s.y === food.y)) return;
      }
    }

    function step() {
      if (dirQueue.length > 0) dir = dirQueue.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall or self collision
      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake-best', best);
        }
        stepMs = Math.max(60, stepMs - 2); // speed up
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle grid
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(canvas.width, i * TILE);
        ctx.stroke();
      }

      // food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#16a34a' : '#22c55e';
        ctx.fillRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2);
      });
    }

    function loop(t) {
      if (!running || paused) return;
      requestAnimationFrame(loop);
      if (t - lastTime < stepMs) return;
      lastTime = t;
      step();
      if (running) draw();
    }

    function start() {
      reset();
      running = true;
      paused = false;
      overlay.classList.add('hidden');
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      overlayTitle.textContent = 'Гру завершено';
      overlayText.textContent = `Рахунок: ${score} — натисніть «Старт», щоб зіграти ще`;
      startBtn.textContent = 'Заново';
      overlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!running) { start(); return; }
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = 'Пауза';
        overlayText.textContent = `Рахунок: ${score} — натисніть пробіл, щоб продовжити`;
        startBtn.textContent = 'Продовжити';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }
    }

    function setDir(x, y) {
      const last = dirQueue.length > 0 ? dirQueue[dirQueue.length - 1] : dir;
      // ignore same direction
      if (last.x === x && last.y === y) return;
      // prevent 180° turn against last queued direction
      if (last.x === -x && last.y === -y) return;
      // buffer up to 3 turns so fast W+A etc. are not lost
      if (dirQueue.length < 3) dirQueue.push({ x, y });
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
        case ' ': togglePause(); e.preventDefault(); break;
      }
    });

    // touch steering: turn relative to tap position vs head
    canvas.addEventListener('pointerdown', e => {
      if (!running || paused) return;
      const r = canvas.getBoundingClientRect();
      const tx = (e.clientX - r.left) / r.width * GRID;
      const ty = (e.clientY - r.top) / r.height * GRID;
      const h = snake[0];
      const dx = tx - (h.x + 0.5), dy = ty - (h.y + 0.5);
      if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
      else setDir(0, Math.sign(dy));
    });

    startBtn.addEventListener('click', () => {
      if (!running) start();
      else if (paused) togglePause();
    });

    reset();
    draw();
  </script>
</body>

</html>
